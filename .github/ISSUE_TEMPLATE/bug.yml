name: Bug report
description: Something is broken. Tell us how to reproduce it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove tokens, phone numbers and channel ids before submitting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. open /ui/content
        2. press "نشر الآن"
        3. ...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Termux on Pixel 7 / Ubuntu 24.04 amd64
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: crmctl status
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From ~/.whatsapp-crm/var/log/*.log
      render: shell
    validations:
      required: false
