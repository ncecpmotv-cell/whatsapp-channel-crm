name: Feature request
description: Propose a change in behaviour, UI or integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the tool makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep in mind the constraints — one process, SQLite, no runtime dependencies, server-rendered UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing" and any external tool that already solves it.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Content pipeline
        - WhatsApp / GOWA
        - Agent / MCP
        - UI / UX
        - Installer / deployment
        - Security
        - Documentation
    validations:
      required: true
