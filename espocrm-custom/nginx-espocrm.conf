# EspoCRM 10 vhost for Termux.
# NOTE: EspoCRM 10 moved the front controller into public/. Pointing the web
# root at the project root (as pre-10 guides say) serves the placeholder
# "configure your webserver" page instead of the app.
server {
    listen 8081;
    server_name _;
    root __ESPO_ROOT__;
    index public/index.php;
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # never expose source, config or database directories
    location ~ ^/(data|application|vendor|bin|install|custom)/ { deny all; }
    location ~ ^/public/(install)/ { deny all; }
    location ~ /\. { deny all; }

    location ~* \.(js|css|woff2|woff|ttf|svg|ico|png|jpg|jpeg|gif|webp|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # REST API front controller
    location ^~ /api/ {
        rewrite ^/api(/.*)$ /public/api/v1/index.php last;
    }

    location / {
        try_files $uri /public/index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index public/index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /data/data/com.termux/files/usr/etc/nginx/fastcgi_params;
    }
}
