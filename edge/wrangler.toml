# Stateless edge tools for the phone CRM.
# The phone keeps the data; this Worker only borrows CPU and secrets.
name = "edge-mcp"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Secrets (never in this file):
#   npx wrangler secret put EDGE_TOKEN        # bearer token the phone sends
#   npx wrangler secret put BRAVE_API_KEY     # optional search key
#   npx wrangler secret put TAVILY_API_KEY    # optional alternative (1k free credits/month)
# Variables (public, safe to commit):
[vars]
MAX_CHARS = "6000"
# Cost guardrails — hard refusals, not warnings. Free tier: R2 10GB / 1M Class A / 10M Class B
# per month, Workers AI 10,000 neurons per day. These numbers keep the project at ~0.2% of it.
KEEP_BACKUPS = "3"
MAX_BACKUP_MB = "8"
MAX_TOTAL_MB = "64"
AI_DAILY_LIMIT = "40"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "crm-backups"

# Free plan allows cron triggers; every 30 minutes keeps the batch warm without a model call.
[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "STATUS"
id = "9114b63f0a7347bb984f52f0e8235f5b"

[ai]
binding = "AI"

[observability]
enabled = true
