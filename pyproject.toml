[project]
name = "whatsapp-channel-crm"
version = "2.0.0"
description = "Single-process CRM for a WhatsApp Channel: content pipeline, contacts, deals, metrics, MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WhatsApp Channel CRM contributors" }]
keywords = ["whatsapp", "crm", "sqlite", "mcp", "arabic", "termux"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["bridge", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"bridge/tests/*" = ["E402"]
"scripts/e2e_local.py" = ["E402"]
